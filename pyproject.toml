[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling==1.33.0"]

[project]
authors         = [{ name = "James Parkington" }]
dependencies    = ["bibtexparser", "cyclopts", "gymnasium", "loguru", "markdown-it-py", "mdit-py-plugins", "numpy", "packaging", "pyboy", "pydantic", "pyyaml", "rich", "scipy", "torch"]
description     = "Trains an agent to play Pokémon Blue from the screen, through PyBoy and PyTorch."
keywords        = [
    "deep-learning",
    "deep-reinforcement-learning",
    "dqn",
    "gameboy",
    "gymnasium",
    "machine-learning",
    "pokemon",
    "pyboy",
    "python",
    "pytorch",
    "q-learning",
    "reinforcement-learning"
]
license         = "MIT"
license-files   = ["LICENSE.md"]
name            = "squirtl"
readme          = "README.md"
requires-python = ">=3.15"
version         = "0.2.0"

[project.scripts]
squirtl = "squirtl.cli:app"

[project.urls]
Homepage   = "https://squirtl.fyi/"
Repository = "https://github.com/Jybbs/squirtl"

[dependency-groups]
dev = [
    "minijinja",
    "prose-formatter",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-socket",
    "pytest-subprocess",
    "syrupy"
]

[tool.coverage.html]
directory = ".cache/coverage/html"

[tool.coverage.report]
fail_under                 = 95
include_namespace_packages = true
precision                  = 2
show_missing               = true

[tool.coverage.run]
branch    = true
data_file = ".cache/coverage/data"
source    = ["src/squirtl"]

[tool.hatch.build.targets.wheel]
packages = ["src/squirtl"]

[tool.hatch.build.targets.wheel.force-include]
".cache/hatch/squirtl.start" = "squirtl.start"

[tool.hatch.build.targets.wheel.hooks.version]
path     = ".cache/hatch/squirtl.start"
template = "squirtl.startup.imports:start"

[tool.prose]
target-version = "3.15"

[tool.prose.imports]
first-party = ["squirtl"]

[tool.pytest]
addopts                  = [
    "--allow-unix-socket",
    "--disable-socket",
    "--import-mode=importlib",
    "-m",
    "not network",
    "-ra",
    "--snapshot-default-extension=common.snapshots.PlainFile",
    "--snapshot-dirname=fixtures"
]
cache_dir                = ".cache/pytest"
empty_parameter_set_mark = "fail_at_collect"
filterwarnings           = [
    "error",
    "ignore:Using SDL2 binaries from pysdl2-dll:UserWarning:sdl2._internal"
]
markers                  = [
    "network: reaches a service over the network, so the default run deselects it and a selected run lets it open a connection",
    "slow: runs longer than a few seconds, so a fast local run deselects it"
]
norecursedirs            = ["common", "fixtures"]
python_files             = ["*.py"]
pythonpath               = ["tests"]
strict                   = true
testpaths                = ["tests"]

[tool.uv]
build-constraint-dependencies = [
    "cython==3.3.1",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "setuptools==84.2.1",
    "tomlkit==0.15.2",
    "trove-classifiers==2026.9.21.13",
    "wheel==0.48.0"
]
python-downloads              = "never"
python-preference             = "only-system"
required-version              = "==0.13.7"

[[tool.uv.index]]
explicit = true
name     = "pytorch-cpu"
url      = "https://download.pytorch.org/whl/cpu"

[tool.uv.extra-build-dependencies]
pyboy = [
    { match-runtime = true, requirement = "numpy" },
    { match-runtime = true, requirement = "setuptools" }
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

name        : 🕹️ Warm
run-name    : 🕹️ Warm · ${{ github.ref_name }}
cache-mode  : read
permissions : { contents: read }

on:
  push:
    branches : [main]
    paths:
      - .github/actions/provision/action.yml
      - .github/workflows/warm.yml
      - .mise/config.toml
      - .mise/mise.lock
      - uv.lock

  workflow_dispatch:

concurrency:
  cancel-in-progress : false
  group              : ${{ github.workflow }}

jobs:
  kit:
    name            : 🏥 Kit · ${{ matrix.tools }}
    cache-mode      : write
    runs-on         : &runner ubuntu-26.04
    timeout-minutes : &timeout 15

    strategy:
      fail-fast: false

      matrix:
        include:
          - caches : uv
            tools  : &package python uv
          - tools: bun lychee node
          - tools: bun python uv
          - tools: zizmor

    steps:
      - &checkout
        name : Check out the repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with : { persist-credentials: false }

      - name : Install the subset and save its archive
        uses : $/.github/actions/provision
        with : { caches: "${{ matrix.caches }}", tools: "${{ matrix.tools }}" }

      - name : Build each wheel `uv.lock` resolves from source and leave only those wheels and the index responses in uv's cache
        if   : matrix.caches == 'uv'
        run  : |
          mise x -- uv sync --locked
          mise x -- uv cache prune --ci

          # `uv cache prune --ci` keeps the unpacked `src` tree beside a wheel uv caches under a
          # subdirectory keyed on its build settings, as PyBoy's `extra-build-dependencies` place it,
          # so this deletes each sdist's `src` tree and leaves every built wheel in place.
          find "$(mise x -- uv cache dir)" -path '*/sdists-v*/*' -type d -name src -prune -exec rm -rf {} +

  prune:
    name            : ✂️ Prune
    cache-mode      : none
    needs           : kit
    permissions     : { actions: write, contents: read }
    runs-on         : *runner
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name              : Delete the cache entries newer entries replaced
        continue-on-error : true
        env               : { GH_TOKEN: "${{ github.token }}" }
        run               : .mise/tasks/gha/prune.py

  brief:
    name            : 🎒 Brief
    if              : always()
    needs           : [kit, prune]
    runs-on         : *runner
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision the tools the summary reads
        uses : $/.github/actions/provision
        with : { tools: *package }

      - name : Write the summary and exit with the verdict
        env  : { NEEDS: "${{ toJSON(needs) }}" }
        run  : mise run gha:brief

name        : 🕹️ CI
run-name    : 🕹️ CI · ${{ github.head_ref || github.ref_name }}
cache-mode  : read
permissions : { contents: read }

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:

concurrency:
  cancel-in-progress : ${{ github.event_name == 'pull_request' }}
  group              : ${{ github.workflow }}-${{ github.head_ref || github.ref }}

jobs:
  check:
    name            : ${{ matrix.name }}
    if              : ${{ !github.event.pull_request.draft }}
    runs-on         : &runner ubuntu-26.04
    timeout-minutes : &timeout 15

    outputs:
      site-coverage : ${{ matrix.report.name == 'site-coverage' && steps.attach.outputs.artifact-url || '' }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name   : 🪧 Audit
            caches : uv
            task   : repo:audit
            tools  : &package python uv
          - name  : 📦 Lockfile
            task  : lock:check
            token : true
            tools : bun python uv
          - name   : 🪻 Prose
            caches : uv
            task   : py:lint
            tools  : *package
          - name   : 🏟️ Suite · Snapshots
            caches : uv
            task   : py:snapshots
            tools  : *package
          - name  : 🗝️ Workflows
            task  : gha:lint
            tools : zizmor
          - name   : ☂️ Coverage
            report : { name: site-coverage, path: .cache/coverage/site }
            task   : site:coverage
            tools  : &site bun lychee node
          - name  : 🍂 Cruft
            task  : site:cruft
            tools : *site
          - name  : ⛓️ Links
            task  : site:links
            tools : *site
          - name  : 🧶 Lint
            task  : site:lint
            tools : *site
          - name  : 💾 Press
            task  : site:press
            tools : *site
          - name  : 🎨 Proof
            task  : site:proof
            tools : *site
          - name  : 🚩 Types
            task  : site:typecheck
            tools : *site

    steps:
      - &checkout
        name : Check out the repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with : { persist-credentials: false }

      - name : Provision the tools and the caches the task reads
        uses : $/.github/actions/provision
        with : { caches: "${{ matrix.caches }}", tools: "${{ matrix.tools }}" }

      - name : mise run ${{ matrix.task }}
        env  : { MISE_GITHUB_TOKEN: "${{ matrix.token && github.token || '' }}", TASK: "${{ matrix.task }}" }
        run  : mise run "$TASK"

      - name : Attach the coverage report
        id   : attach
        if   : ${{ !cancelled() && matrix.report }}
        uses : actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with : { name: "${{ matrix.report.name }}", path: "${{ matrix.report.path }}", retention-days: 14 }

  suite:
    name            : 🏟️ Suite · ${{ matrix.group }}
    if              : ${{ !github.event.pull_request.draft }}
    runs-on         : *runner
    timeout-minutes : *timeout

    strategy:
      fail-fast: false

      matrix:
        group: [1, 2, 3]

    steps:
      - *checkout

      - name : Provision the tools and the caches the task reads
        uses : $/.github/actions/provision
        with : { caches: uv, tools: *package }

      - name : mise run py:split
        env  : { GROUP: "${{ matrix.group }}", SEED: "${{ github.run_id }}", SPLITS: "${{ strategy.job-total }}" }
        run  : mise run py:split --group "$GROUP" --randomly-seed "$SEED" --splits "$SPLITS"

      - name : Attach the coverage data
        if   : ${{ !cancelled() }}
        uses : actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with : { if-no-files-found: error, name: "coverage-data-${{ matrix.group }}", path: .cache/coverage/data, retention-days: 1 }

  combine:
    name            : 🏟️ Suite
    if              : ${{ !cancelled() && !github.event.pull_request.draft }}
    needs           : suite
    outputs         : { coverage: "${{ steps.attach.outputs.artifact-url }}" }
    runs-on         : *runner
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision the tools the combining script reads
        uses : $/.github/actions/provision
        with : { tools: *package }

      - name : Download the coverage data of every machine
        uses : actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with : { path: .cache/coverage/parts, pattern: coverage-data-* }

      - name : mise run py:combine
        run  : mise run py:combine

      - name : Attach the coverage report
        id   : attach
        if   : ${{ !cancelled() }}
        uses : actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with : { name: coverage, path: .cache/coverage/html, retention-days: 14 }

  brief:
    name            : 🎒 Brief
    if              : always() && !github.event.pull_request.draft
    needs           : [check, combine, suite]
    runs-on         : *runner
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision the tools the summary reads
        uses : $/.github/actions/provision
        with : { tools: *package }

      - name : Write the summary and exit with the verdict
        env  : { COMMIT: "${{ github.event.pull_request.head.sha }}", NEEDS: "${{ toJSON(needs) }}" }
        run  : mise run gha:brief

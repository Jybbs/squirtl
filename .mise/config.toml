min_version = "2026.11.12"

[doctor.checks.cartridge]
description = "A file sits at `data/rom.gb`, the place a run reads the user's own ROM of Pokémon Blue from"
hint        = "Copy your own ROM of the English Pokémon Blue to `data/rom.gb`, which `.gitignore` keeps out of the repository, and a run refuses any other ROM there with a message naming the SHA-1 it found."
run         = "test -f data/rom.gb"
timeout     = "5s"

[doctor.checks.compiler]
description = "A C compiler runs as `cc`, through which `uv sync` builds each package that ships no wheel for the pinned Python"
hint        = "Install a C compiler, through `xcode-select --install` on macOS and the distribution's `gcc` package on Linux."
run         = "cc --version"
timeout     = "10s"

[doctor.checks.lockfile]
description = "`uv.lock`, each task script's lockfile, `.mise/mise.lock`, and `docs/bun.lock` resolve what their manifests declare, every tool the project pins installs from `.mise/mise.lock`, and no advisory names a pinned tool beyond one `AUDIT_IGNORE` lists while `mise audit` names no fix for it and still finds it in the newest release of the pin's line"
hint        = "Run `mise lockfile` to print what drifted, then `mise relock` to re-resolve every lockfile against its manifest. Where it names an advisory and a release to lift to, lift the tool in `[tools]` to it, deleting from `AUDIT_IGNORE` each id the line names there. Where it names an advisory alone, add its id to `AUDIT_IGNORE`, which passes it until `mise audit` names a fix for it or no longer finds it in the newest release of the pin's line, its first two parts."
run         = "mise run lock:check"
timeout     = "60s"

[doctor.checks.venv]
description = "`.venv` is absent until the first `squirtl` builds it, or sits on the interpreter `.mise/config.toml` pins"
hint        = "Run `mise install`, and remove `.venv` where it is a link or a file, then run `uv venv --clear` and `uv sync`, which rebuild `.venv` from `uv.lock` on the interpreter mise pins."
run         = 'test ! -L .venv && test ! -e .venv || test .venv/bin/python -ef "$(mise which python)"'
timeout     = "10s"

[env]
AUDIT_IGNORE              = "CVE-2026-124249"
BUN_INSTALL_CACHE_DIR     = "{{config_root}}/.cache/bun"
NPM_CONFIG_IGNORE_SCRIPTS = "1"
PROSE_CACHE_DIR           = "{{config_root}}/.cache/prose"
PYTHONPYCACHEPREFIX       = "{{config_root}}/.cache/pycache"
UV_LOCKED                 = "1"
_.path                    = ".mise/bin"

[settings]
auto_install = false

[tool_config]
locked = true

[tools]
bun    = "1.4.4"
lychee = "0.24.2"
node   = "26.13.1"
python = "3.15.2"
uv     = "0.13.9"
zizmor = "1.32.0"

min_version = "2026.9.18"

[doctor.checks.lockfile]
description = "`uv.lock` and `.mise/mise.lock` resolve what `pyproject.toml` and `.mise/config.toml` declare"
hint        = "Run `mise lockfile` to print what drifted, or the platform `mise lock` could not resolve without a connection, then `mise relock` to re-resolve both lockfiles against their manifests."
run         = "mise run lock:check"
timeout     = "60s"

[doctor.checks.venv]
description = "`.venv` was built on the interpreter `.mise/config.toml` pins"
hint        = "Run `uv venv --clear` and then `uv sync`, which rebuild `.venv` from `uv.lock` on the interpreter mise pins."
run         = 'test .venv/bin/python -ef "$(mise which python)"'
timeout     = "10s"

[env]
PROSE_CACHE_DIR     = "{{config_root}}/.cache/prose"
PYTHONPYCACHEPREFIX = "{{config_root}}/.cache/pycache"
UV_LOCKED           = "1"
_.path              = ".mise/bin"

[settings]
auto_install = false

[tool_config]
locked = true

[tools]
python = "3.14.6"
uv     = "0.12.13"
